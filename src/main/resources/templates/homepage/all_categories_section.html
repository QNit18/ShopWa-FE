<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">
    <div class="col-1 full-details" th:each="cat : ${listCategories}">
        <div style="text-align: center;">
            <img th:src="@{${cat.imagePath}}" width="60" height="60"/>
        </div>
        <div style="text-align: center;font-size: 16px">
            <a th:href="@{'/c/' + ${cat.alias}}">[[${cat.name}]]</a>
        </div>
    </div>

    <div class="col-3 less-details" th:each="cat : ${listCategories}">
        <div style="text-align: center;">
            <img th:src="@{${cat.imagePath}}" width="50" height="50"/>
        </div>
        <div style="text-align: center; font-size: 12px">
            <a th:href="@{'/c/' + ${cat.alias}}">[[${cat.name}]]</a>
        </div>
    </div>

</div>
</div>
</body>
</html>
