<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="content" th:remove="tag" >
		<div class="col-sm-1" th:each="brandSection : ${section.brandSections}" th:with="brand = ${brandSection.brand}">
			<div><img th:src="@{${brand.logoPath}}" width="60" height="60"/></div>
			<div class="ml-1">
				<a th:href="@{'/brand/' + ${brand.id}}">[[${brand.name}]]</a>
			</div>
		</div>			
	</div>
</body>
</html>
