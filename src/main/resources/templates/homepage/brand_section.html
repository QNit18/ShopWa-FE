<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="content" th:remove="tag" >
		<div class="col-1 full-details" th:each="brandSection : ${section.brandSections}" th:with="brand = ${brandSection.brand}">
			<div style="text-align: center;">
				<img th:src="@{${brand.logoPath}}" width="60" height="60"/>
			</div>
			<div  style="text-align: center; font-size: 15px">
				<a th:href="@{'/brand/' + ${brand.id}}">[[${brand.name}]]</a>
			</div>
		</div>

		<div class="col-3 less-details" th:each="brandSection : ${section.brandSections}" th:with="brand = ${brandSection.brand}">
			<div style="text-align: center;">
				<img th:src="@{${brand.logoPath}}" width="60" height="60"/>
			</div>
			<div  style="text-align: center; font-size: 12px">
				<a th:href="@{'/brand/' + ${brand.id}}">[[${brand.name}]]</a>
			</div>
		</div>
	</div>
</body>
</html>
